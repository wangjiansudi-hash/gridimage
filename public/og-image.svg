<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans SC','Plus Jakarta Sans',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand badge -->
  <g transform="translate(80 70)">
    <rect width="64" height="64" rx="16" fill="#2563eb"/>
    <g transform="translate(16 16) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <line x1="20" y1="12" x2="8.12" y2="19.88"/>
      <line x1="14.47" y1="14.48" x2="20" y2="12"/>
      <line x1="8.12" y1="4.12" x2="20" y2="12"/>
    </g>
    <text x="84" y="42" font-size="26" font-weight="700" fill="#e2e8f0">视频号封面切割工具</text>
  </g>

  <!-- main title -->
  <text x="80" y="260" font-size="72" font-weight="800" fill="#ffffff">多宫格封面</text>
  <text x="80" y="340" font-size="72" font-weight="800" fill="url(#accent)">智能一键切割</text>

  <!-- subtitle -->
  <text x="82" y="400" font-size="28" font-weight="500" fill="#cbd5e1">支持 1×3 / 2×3 / 3×3 · 分割线微调 · 无损批量导出 ZIP</text>

  <!-- feature pills -->
  <g font-size="22" font-weight="600">
    <rect x="80" y="450" width="200" height="48" rx="24" fill="#1e293b" stroke="#334155"/>
    <text x="180" y="480" text-anchor="middle" fill="#60a5fa">纯前端本地处理</text>
    <rect x="300" y="450" width="160" height="48" rx="24" fill="#1e293b" stroke="#334155"/>
    <text x="380" y="480" text-anchor="middle" fill="#fbbf24">零上传隐私安全</text>
    <rect x="480" y="450" width="180" height="48" rx="24" fill="#1e293b" stroke="#334155"/>
    <text x="570" y="480" text-anchor="middle" fill="#34d399">发布顺序编号</text>
  </g>

  <!-- 9-grid mockup on the right -->
  <g transform="translate(760 110)">
    <rect width="380" height="510" rx="28" fill="#000" opacity="0.35"/>
    <!-- phone notch -->
    <rect x="150" y="14" width="80" height="14" rx="7" fill="#0f172a"/>
    <!-- 3x3 grid -->
    <g transform="translate(24 56)">
      <!-- row1 -->
      <rect x="0" y="0" width="100" height="130" rx="10" fill="#1e3a8a"/>
      <rect x="116" y="0" width="100" height="130" rx="10" fill="#1e40af"/>
      <rect x="232" y="0" width="100" height="130" rx="10" fill="#2563eb"/>
      <!-- row2 -->
      <rect x="0" y="146" width="100" height="130" rx="10" fill="#3b82f6"/>
      <rect x="116" y="146" width="100" height="130" rx="10" fill="#f59e0b"/>
      <rect x="232" y="146" width="100" height="130" rx="10" fill="#3b82f6"/>
      <!-- row3 -->
      <rect x="0" y="292" width="100" height="130" rx="10" fill="#2563eb"/>
      <rect x="116" y="292" width="100" height="130" rx="10" fill="#1e40af"/>
      <rect x="232" y="292" width="100" height="130" rx="10" fill="#1e3a8a"/>
      <!-- cut lines hint -->
      <line x1="108" y1="-6" x2="108" y2="428" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.9"/>
      <line x1="224" y1="-6" x2="224" y2="428" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.9"/>
    </g>
  </g>

  <!-- url footer -->
  <text x="80" y="580" font-size="24" font-weight="600" fill="#64748b" letter-spacing="1">grid.smartbid.site</text>
</svg>
