name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# 防止并发部署：同一时刻只跑一个，后续排队不取消（避免半部署状态）
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "invalid key"; exit 1; }

      - name: Deploy via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            dist/ "$VPS_USER@$VPS_HOST:/var/www/grid/"
          echo "rsync deploy done"

      - name: Health check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://grid.smartbid.site/robots.txt)
          echo "robots.txt -> $code"
          if [ "$code" != "200" ]; then echo "health check failed"; exit 1; fi
          echo "health check passed"
